name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

# A single job on purpose. Every job pays for its own `checkout + mise + uv sync
# (+ npm ci)`, and GitHub rounds Actions billing up to the whole minute per job.
# Splitting `test` out bought nothing: on the last two-job run it took 17s, of
# which the `npm test` step was 1s — the other 16s duplicated `check`'s
# provisioning, and the two ran in parallel so the split saved no wall clock
# either. Add checks as steps, not as jobs.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Static checks (prettier / markdownlint / ruff / pyright / pyrefly / ty)
        run: npm run check:all

      - name: Tests
        run: npm test
