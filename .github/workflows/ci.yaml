name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Static checks (prettier / markdownlint / ruff / pyright / pyrefly / ty)
        run: npm run check:all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: npm test
